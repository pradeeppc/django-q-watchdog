name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "4.2.*", q: "django-q2" }
          - { python: "3.12", django: "5.2.*", q: "django-q2" }
          - { python: "3.13", django: "6.0.*", q: "django-q2" }
          # the original django-q: needs pkg_resources from an older setuptools
          - { python: "3.11", django: "4.2.*", q: '"django-q==1.3.9" "setuptools<70"' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest pytest-django "django==${{ matrix.django }}" ${{ matrix.q }}
      - run: pytest -v
